# Botões do show (gerado da Virtual Console do QLC+).
#
# function: ID da Function no workspace do QLC+.
# layer:    base   - modos de pista e cores fixas; um por vez (apertar de novo apaga)
#           strobe - strobo contínuo; sobrepõe a base (apertar de novo desliga)
#           flash  - só enquanto o botão estiver segurado; sobrepõe tudo
# color:    cor do botão na interface web (copiada da Virtual Console).
# key:      atalho de teclado na interface web (opcional, uma letra).
#           Fixos: espaço = blackout | b = parar strobe | Esc = parar tudo

workspace: aniversario_STROBE.qxw

# Segurança (strobo/flash): tempo máximo ativo antes de desligar sozinho.
limits:
  flash: 10s
  strobe: 60s

groups:
  - name: "MODOS DE PISTA"  # um modo por vez
    layer: base
    buttons:
      - {caption: "AZUL ROSA", function: 30, color: "#3f55c8"}
      - {caption: "BATIDÃO", function: 51, color: "#b01540"}
      - {caption: "BRANCO VERMELHO", function: 57, color: "#d62828"}
      - {caption: "CALOR", function: 63, color: "#c75a18"}
      - {caption: "CAOS QUENTE", function: 73, color: "#c42b0a"}
      - {caption: "CHILL", function: 47, color: "#35539e"}
      - {caption: "CINEMA", function: 69, color: "#7a2626"}
      - {caption: "CLUB", function: 43, color: "#5a39c8"}
      - {caption: "COLOR FLOW", function: 53, color: "#3a93a8"}
      - {caption: "CONTRAMÃO", function: 65, color: "#b24f14"}
      - {caption: "DOURADO VERMELHO", function: 71, color: "#cf8012"}
      - {caption: "FESTA", function: 49, color: "#bd3ba2"}
      - {caption: "FLASH", function: 55, color: "#e8e8e8"}
      - {caption: "FOGO", function: 61, color: "#e8470f"}
      - {caption: "FOGO CRUZADO", function: 89, color: "#e05410"}
      - {caption: "GOLDEN", function: 59, color: "#d4a017"}
      - {caption: "IMPACTO", function: 83, color: "#d02828"}
      - {caption: "MENINOS E MENINAS 1", function: 79, color: "#8e2a80"}
      - {caption: "MENINOS E MENINAS 2", function: 33, color: "#8e2a80"}
      - {caption: "MENINOS E MENINAS 3", function: 81, color: "#8e2a80"}
      - {caption: "PERSEGUIÇÃO", function: 85, color: "#d4860f"}
      - {caption: "POP", function: 41, color: "#d13c8c"}
      - {caption: "PULSO QUENTE", function: 67, color: "#a8481a"}
      - {caption: "PULSO QUENTE 2", function: 93, color: "#a8481a"}
      - {caption: "QUENTE", function: 45, color: "#d14a14"}
      - {caption: "RED 200", function: 77, color: "#c02020"}
      - {caption: "SURTO QUENTE", function: 91, color: "#bd350a"}
      - {caption: "TRICOLOR", function: 35, color: "#6a4ac0"}
      - {caption: "VERDE AZUL ROSA", function: 39, color: "#1f8f8f"}
      - {caption: "VERDE ROSA", function: 37, color: "#2e9460"}
      - {caption: "VERMELHO BRANCO 2", function: 87, color: "#e03535"}
      - {caption: "ÂMBAR 200", function: 75, color: "#d79415"}
  - name: "CORES FIXAS"  # também na camada base: trocar de cor encerra o modo de pista
    layer: base
    buttons:
      - {caption: "BRANCO", function: 6, key: q, color: "#ffffff"}
      - {caption: "VERMELHO", function: 0, key: w, color: "#ff0000"}
      - {caption: "VERMELHO PROFUNDO", function: 22, key: e, color: "#c80000"}
      - {caption: "ROSA VERMELHO", function: 24, key: r, color: "#ff0a2d"}
      - {caption: "ÂMBAR", function: 16, key: t, color: "#ff2d00"}
      - {caption: "ÂMBAR DOURADO", function: 18, key: y, color: "#ff3700"}
      - {caption: "DOURADO", function: 17, key: u, color: "#ff5000"}
      - {caption: "LARANJA QUEIMADO", function: 20, key: i, color: "#ff1900"}
      - {caption: "ROXO PROFUNDO", function: 31, key: o, color: "#5a00c8"}
      - {caption: "AZUL", function: 1, key: p, color: "#0000ff"}
      - {caption: "AZUL PROFUNDO", function: 12, key: k, color: "#0000a0"}
      - {caption: "CIANO", function: 8, key: l, color: "#00ffff"}
  - name: "FRITAÇÃO"  # só enquanto a tecla estiver segurada
    layer: flash
    buttons:
      - {caption: "BRANCO MÁX. 255", function: 94, key: a, color: "#ffffff"}
      - {caption: "BRANCO 254", function: 100, key: s, color: "#ffffff"}
      - {caption: "VERMELHO 253", function: 95, key: d, color: "#ff0000"}
      - {caption: "LARANJA 252", function: 96, key: f, color: "#ff1900"}
      - {caption: "AZUL PROF. 253", function: 97, key: g, color: "#0000a0"}
      - {caption: "AZUL 252", function: 98, key: h, color: "#0000ff"}
      - {caption: "CIANO 254", function: 99, key: j, color: "#00ffff"}
  - name: "STROBE CONTÍNUO"  # toggle; "b" desliga
    layer: strobe
    buttons:
      - {caption: "BRANCO 254", function: 101, key: z, color: "#ffffff"}
      - {caption: "VERMELHO 253", function: 102, key: x, color: "#ff0000"}
      - {caption: "LARANJA 252", function: 103, key: c, color: "#ff1900"}
      - {caption: "AZUL PROF. 253", function: 104, key: v, color: "#0000a0"}
